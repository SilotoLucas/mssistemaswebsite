name: mssistemas

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  web:
    <<: *logs
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      default: {}
      borda:
        aliases:
          - mssistemas-web

networks:
  borda:
    external: true
